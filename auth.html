<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>89Connect — Вход</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --brown: #8c7968;
      --dark-brown: #655548;
      --brown-light: #e8dfd7;
      --cream: #f8f6f4;
      --text: #292725;
      --muted: #817b76;
      --white: #ffffff;
      --border: #e5e1dd;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--cream);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text);
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 30px;
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      color: var(--dark-brown);
      margin-bottom: 8px;
    }

    .logo span {
      color: var(--brown);
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      background: var(--cream);
      padding: 5px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .tab {
      flex: 1;
      padding: 11px;
      border: none;
      background: transparent;
      border-radius: 9px;
      cursor: pointer;
      font-size: 14px;
    }

    .tab.active {
      background: var(--white);
      color: var(--dark-brown);
      font-weight: 700;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 15px;
      outline: none;
      font-size: 14px;
      background: white;
    }

    input:focus,
    select:focus {
      border-color: var(--brown);
    }

    button.submit {
      width: 100%;
      border: none;
      background: var(--dark-brown);
      color: white;
      padding: 13px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 5px;
    }

    button.submit:hover {
      opacity: .9;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #f7e3e0;
      color: #8a3c32;
    }

    .message.success {
      background: #e3eee4;
      color: #426147;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    89<span>Connect</span>
  </div>

  <div class="subtitle">
    Социальная сеть школы №89
  </div>


  <div class="tabs">

    <button
      class="tab active"
      onclick="showForm('login', this)"
    >
      Войти
    </button>

    <button
      class="tab"
      onclick="showForm('register', this)"
    >
      Регистрация
    </button>

  </div>


  <div id="message" class="message"></div>


  <!-- LOGIN -->

  <form
    id="loginForm"
    class="form active"
    onsubmit="login(event)"
  >

    <label>
      Email
    </label>

    <input
      id="loginEmail"
      type="email"
      placeholder="example@gmail.com"
      required
    >


    <label>
      Пароль
    </label>

    <input
      id="loginPassword"
      type="password"
      placeholder="••••••••"
      required
    >


    <button
      class="submit"
      type="submit"
    >
      Войти
    </button>

  </form>


  <!-- REGISTER -->

  <form
    id="registerForm"
    class="form"
    onsubmit="register(event)"
  >

    <label>
      Имя
    </label>

    <input
      id="firstName"
      type="text"
      placeholder="Нурасыл"
      required
    >


    <label>
      Фамилия
    </label>

    <input
      id="lastName"
      type="text"
      placeholder="Шамельханов"
      required
    >


    <label>
      Класс
    </label>

    <select id="className" required>

      <option value="">
        Выбери класс
      </option>

      <option value="9А">9А</option>
      <option value="9Б">9Б</option>
      <option value="9В">9В</option>
      <option value="9Г">9Г</option>
      <option value="9Д">9Д</option>
      <option value="9Е">9Е</option>
      <option value="9Ж">9Ж</option>
      <option value="9З">9З</option>
      <option value="9И">9И</option>

    </select>


    <label>
      Email
    </label>

    <input
      id="registerEmail"
      type="email"
      placeholder="example@gmail.com"
      required
    >


    <label>
      Пароль
    </label>

    <input
      id="registerPassword"
      type="password"
      placeholder="Минимум 6 символов"
      minlength="6"
      required
    >


    <button
      class="submit"
      type="submit"
    >
      Создать аккаунт
    </button>

  </form>

</div>


<script>

const SUPABASE_URL =
  "https://bqbwrqmlmfehzkoifkiz.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_X5SdlHOKGcZ8RygNFQM2Tg__idY7zWd";


const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// ==============================
// TABS
// ==============================

function showForm(formName, button) {

  document
    .querySelectorAll(".form")
    .forEach(form => {
      form.classList.remove("active");
    });


  document
    .querySelectorAll(".tab")
    .forEach(tab => {
      tab.classList.remove("active");
    });


  document
    .getElementById(formName + "Form")
    .classList.add("active");


  button.classList.add("active");

}


// ==============================
// REGISTER
// ==============================

async function register(event) {

  event.preventDefault();

  const firstName =
    document.getElementById("firstName").value.trim();

  const lastName =
    document.getElementById("lastName").value.trim();

  const className =
    document.getElementById("className").value;

  const email =
    document.getElementById("registerEmail").value.trim();

  const password =
    document.getElementById("registerPassword").value;


  showMessage(
    "Создаём аккаунт...",
    "success"
  );


  const {
    data,
    error
  } = await db.auth.signUp({

    email,
    password,

    options: {

      data: {

        first_name: firstName,

        last_name: lastName,

        class_name: className

      }

    }

  });


  if (error) {

    showMessage(
      error.message,
      "error"
    );

    return;
  }


  if (!data.user) {

    showMessage(
      "Не удалось создать аккаунт.",
      "error"
    );

    return;
  }


  showMessage(
    "Аккаунт создан! Переходим...",
    "success"
  );


  setTimeout(() => {

    window.location.href =
      "index.html";

  }, 800);

}


// ==============================
// LOGIN
// ==============================

async function login(event) {

  event.preventDefault();


  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;


  showMessage(
    "Выполняем вход...",
    "success"
  );


  const {
    data,
    error
  } = await db.auth.signInWithPassword({

    email,
    password

  });


  if (error) {

    showMessage(
      error.message,
      "error"
    );

    return;
  }


  window.location.href =
    "index.html";

}


// ==============================
// MESSAGE
// ==============================

function showMessage(text, type) {

  const message =
    document.getElementById("message");


  message.textContent = text;

  message.className =
    "message show " + type;

}

</script>

</body>
</html>
